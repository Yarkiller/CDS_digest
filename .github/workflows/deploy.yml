name: Deploy

# Triggered only after the CI workflow succeeds on `main`
# (or manually via the Actions UI).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-frontend:
    name: Deploy frontend (Vercel)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deployment skipped (no token)
        if: ${{ env.VERCEL_TOKEN == '' }}
        run: echo "VERCEL_TOKEN is not configured — skipping Vercel deploy."

      - name: Deploy to Vercel (production)
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel build --prod --token "$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"

  deploy-backend:
    name: Deploy backend (Railway)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    env:
      RAILWAY_DEPLOY_HOOK: ${{ secrets.RAILWAY_DEPLOY_HOOK }}
    steps:
      - name: Deployment skipped (no deploy hook)
        if: ${{ env.RAILWAY_DEPLOY_HOOK == '' }}
        run: echo "RAILWAY_DEPLOY_HOOK is not configured — skipping Railway deploy."

      - name: Trigger Railway deployment
        if: ${{ env.RAILWAY_DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "$RAILWAY_DEPLOY_HOOK"

  smoke:
    name: Post-deploy smoke (live endpoints)
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    if: always()
    env:
      FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://digest-cds.vercel.app' }}
      BACKEND_READY_URL: ${{ vars.BACKEND_READY_URL || 'https://digest-cds-api-production.up.railway.app/health/ready' }}
    steps:
      - name: Frontend responds 200
        run: |
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL" || true)
            if [ "$code" = "200" ]; then
              echo "frontend OK ($FRONTEND_URL -> 200)"
              exit 0
            fi
            sleep 6
          done
          echo "frontend not healthy: last status=$code ($FRONTEND_URL)"
          exit 1

      - name: Backend readiness returns ready
        run: |
          for attempt in $(seq 1 10); do
            body=$(curl -s "$BACKEND_READY_URL" || true)
            if printf '%s' "$body" | grep -q '"status":"ready"'; then
              echo "backend ready ($BACKEND_READY_URL -> $body)"
              exit 0
            fi
            sleep 6
          done
          echo "backend not ready: last body=$body ($BACKEND_READY_URL)"
          exit 1
