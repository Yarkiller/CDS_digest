[project]
name = "data-collection"
version = "0.1.0"
description = "External API adapters and DTOs for Digest CDS"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "youtube-transcript-api>=1.2.0,<2",
    "httpx[socks]==0.28.1",
    "requests[socks]",
    "openai>=3.0,<4",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "data_collection"
module-root = "src"
